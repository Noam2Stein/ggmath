name: Cargo Build & Test

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    runs-on: ${{ matrix.rust.os }}
    strategy:
      matrix:
        rust:
        # x86
        - { target: i686-pc-windows-msvc, os: windows-latest }
        # x86_64
        - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.95.0"
        target:  ${{ matrix.rust.target }}
        components: clippy
    - uses: Swatinem/rust-cache@master

    - name: Clippy
      run: RUSTFLAGS="-D warnings" cargo clippy --all-targets --target ${{ matrix.rust.target }}

    - name: Clippy (with libm)
      run: RUSTFLAGS="-D warnings" cargo clippy --all-targets --features libm --target ${{ matrix.rust.target }}

    - name: Clippy (with optional dependencies)
      run: RUSTFLAGS="-D warnings" cargo clippy --all-targets --features "bytemuck fixed mint rand serde wide" --target ${{ matrix.rust.target }}

    - name: Clippy (with optional dependencies, with libm)
      run: RUSTFLAGS="-D warnings" cargo clippy --all-targets --all-features --target ${{ matrix.rust.target }}

    - name: Test (with optional dependencies)
      run: RUSTFLAGS="-D warnings -C debug-assertions=off -C overflow-checks=off" cargo test --features "bytemuck fixed mint rand serde wide" --target ${{ matrix.rust.target }}

    - name: Test (with debug assertions, with optional dependencies, with libm)
      run: RUSTFLAGS="-D warnings -C debug-assertions=on -C overflow-checks=on" cargo test --all-features --target ${{ matrix.rust.target }}

    - name: Test with SSE4.1 (with optional dependencies)
      if: matrix.rust.os == 'ubuntu-latest' && matrix.rust.target == 'x86_64-unknown-linux-gnu'
      run: RUSTFLAGS="-D warnings -C target-feature=+sse4.1 -C debug-assertions=off -C overflow-checks=off" cargo test --features "bytemuck fixed mint rand serde wide" --target ${{ matrix.rust.target }}

    - name: Test with SSE4.2 (with optional dependencies)
      if: matrix.rust.os == 'ubuntu-latest' && matrix.rust.target == 'x86_64-unknown-linux-gnu'
      run: RUSTFLAGS="-D warnings -C target-feature=+sse4.2 -C debug-assertions=off -C overflow-checks=off" cargo test --features "bytemuck fixed mint rand serde wide" --target ${{ matrix.rust.target }}

    - name: Test with SSSE3 (with optional dependencies)
      if: matrix.rust.os == 'ubuntu-latest' && matrix.rust.target == 'x86_64-unknown-linux-gnu'
      run: RUSTFLAGS="-D warnings -C target-feature=+ssse3 -C debug-assertions=off -C overflow-checks=off" cargo test --features "bytemuck fixed mint rand serde wide" --target ${{ matrix.rust.target }}

    - name: Test with SSE4.1, SSE4.2 and SSSE3 (with optional dependencies)
      if: matrix.rust.os == 'ubuntu-latest' && matrix.rust.target == 'x86_64-unknown-linux-gnu'
      run: RUSTFLAGS="-D warnings -C target-feature=+sse4.1,+sse4.2,+ssse3 -C debug-assertions=off -C overflow-checks=off" cargo test --features "bytemuck fixed mint rand serde wide" --target ${{ matrix.rust.target }}

  doc:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.95.0
    - uses: Swatinem/rust-cache@master

    - name: Verify documentation (without optional dependencies)
      run: cargo doc --no-deps

    - name: Verify documentation (with optional dependencies)
      run: cargo doc --no-deps --features "bytemuck fixed mint rand serde wide"
